name: Build

on:
  push:
    branches: [main, release, dev, 'agents/**', 'session/**', 'release-fix/**']
  pull_request:
    branches: [main, release, dev]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake conan

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web

      - name: Package web build
        run: |
          mkdir web-dist
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data web-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: FlightGame-web
          path: web-dist/**
          if-no-files-found: error

  ios-sim:
    # Spike: must never turn dev red while the iOS toolchain is still being worked out.
    continue-on-error: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=

      - name: Build
        run: cmake --build build-ios --config Release

      - name: Check bundled assets
        run: |
          test -f build-ios/Release-iphonesimulator/FlightGame.app/assets/models/biplane-1920.glb
          test -f build-ios/Release-iphonesimulator/FlightGame.app/assets/models/biplane-1920.break.txt

      - name: Check Info.plist orientation and launch screen
        run: |
          plist=build-ios/Release-iphonesimulator/FlightGame.app/Info.plist
          pb=/usr/libexec/PlistBuddy
          for key in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            out=$($pb -c "Print :$key" "$plist")
            echo "$out"
            echo "$out" | grep -q UIInterfaceOrientationLandscapeLeft
            echo "$out" | grep -q UIInterfaceOrientationLandscapeRight
            if echo "$out" | grep -q Portrait; then exit 1; fi
          done
          test "$($pb -c 'Print :UIRequiresFullScreen' "$plist")" = true
          test "$($pb -c 'Print :UIStatusBarHidden' "$plist")" = true
          test "$($pb -c 'Print :UIViewControllerBasedStatusBarAppearance' "$plist")" = false
          $pb -c 'Print :UILaunchScreen' "$plist"
          test "$($pb -c 'Print :CFBundleIdentifier' "$plist")" = com.flightgame.FlightGame

      - name: Check app icon
        run: |
          app=build-ios/Release-iphonesimulator/FlightGame.app
          ls "$app"
          test -f "$app/Assets.car"
          out=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$app/Info.plist") || exit 1
          echo "$out"
          if ! echo "$out" | grep -q AppIcon; then exit 1; fi
