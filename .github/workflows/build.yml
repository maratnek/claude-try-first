name: Build

on:
  push:
    branches: [main, release, dev, agents, start-with-raylib]
  pull_request:
    branches: [main, release, dev]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake conan

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web

      - name: Package web build
        run: |
          mkdir web-dist
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data web-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: FlightGame-web
          path: web-dist/**
          if-no-files-found: error
