<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flight Game</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    touch-action: none;
  }
  #fullscreen {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 2;
    padding: 8px 12px;
    font: 14px sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 6px;
    cursor: pointer;
  }
  #loading {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
    color: #fff;
    font: 18px sans-serif;
  }
  #loading[hidden] { display: none; }
  #loading-bar {
    position: relative;
    width: min(240px, 60vw);
    height: 3px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.25);
  }
  #loading-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 0;
    background: #fff;
  }
  #loading-fill.indeterminate {
    width: 40%;
    animation: loading-slide 1.2s ease-in-out infinite;
  }
  @keyframes loading-slide {
    from { left: -40%; }
    to { left: 100%; }
  }
  #rotate-hint {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    font: 18px sans-serif;
    text-align: center;
  }
  #rotate-hint button {
    padding: 8px 16px;
    font: 16px sans-serif;
    color: #fff;
    background: transparent;
    border: 1px solid #fff;
    border-radius: 6px;
  }
  @media (orientation: portrait) and (max-width: 600px) {
    #rotate-hint.active { display: flex; }
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<button id="fullscreen" type="button" hidden>Fullscreen</button>
<div id="loading">
  <div id="loading-text">Loading…</div>
  <div id="loading-bar"><div id="loading-fill" class="indeterminate"></div></div>
</div>
<div id="rotate-hint" class="active">
  <div>Rotate your phone to landscape to play</div>
  <button id="rotate-dismiss" type="button">Play anyway</button>
</div>
<script>
  var canvas = document.getElementById('canvas');

  ['touchmove', 'gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });

  document.getElementById('rotate-dismiss').addEventListener('click', function () {
    document.getElementById('rotate-hint').classList.remove('active');
  });

  var fsButton = document.getElementById('fullscreen');
  var fsTarget = document.documentElement;
  var requestFs = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
  // iOS Safari has no Fullscreen API for non-video elements
  if (requestFs) {
    fsButton.hidden = false;
    fsButton.addEventListener('click', function () {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        requestFs.call(fsTarget);
      }
    });
    var syncFs = function () {
      fsButton.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit fullscreen' : 'Fullscreen';
    };
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);
  }

  var loadingEl = document.getElementById('loading');
  var loadingFill = document.getElementById('loading-fill');

  var loadingText = document.getElementById('loading-text');
  var loadingFailed = false;

  var failLoading = function () {
    loadingFailed = true;
    loadingText.textContent = 'Failed to load, see console';
    loadingFill.classList.remove('indeterminate');
    loadingFill.style.width = '0';
  };

  var setLoadingStatus = function (text) {
    if (loadingFailed) return;
    if (!text) {
      loadingEl.hidden = true;
      return;
    }
    if (text.indexOf('Exception') === 0) {
      failLoading();
      return;
    }
    var match = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text);
    if (match && Number(match[2]) > 0) {
      var fraction = Math.min(1, Number(match[1]) / Number(match[2]));
      loadingFill.classList.remove('indeterminate');
      loadingFill.style.width = (fraction * 100) + '%';
    } else {
      loadingFill.classList.add('indeterminate');
      loadingFill.style.width = '';
    }
  };

  var Module = {
    canvas: canvas,
    setStatus: setLoadingStatus,
    onAbort: failLoading,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
